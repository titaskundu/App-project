plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.posecamera'
version = '0.1.0'

android {
  namespace "expo.modules.posecamera"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    // Keeps MediaPipe's classes when release builds shrink the code (R8).
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // CameraX: Android's standard camera library (preview + frames for analysis).
  def camerax = '1.6.2'
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"

  // MediaPipe Pose Landmarker (Google's on-device body tracker). Its LLM runtime dependency
  // isn't needed for pose detection, so it's left out (saves ~20 MB).
  implementation('com.google.mediapipe:tasks-vision:1.2.2') {
    exclude group: 'com.google.ai.edge.litertlm'
  }
}
